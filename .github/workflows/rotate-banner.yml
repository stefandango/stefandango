name: Rotate banner

on:
  schedule:
    - cron: "0 5 * * 1"   # Mondays 05:00 UTC
  workflow_dispatch:       # manual run from the Actions tab

permissions:
  contents: write

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pick this week's banner
        run: |
          variants=(record terminal gitlog)
          week=$(date -u +%V)
          v=${variants[$((10#$week % ${#variants[@]}))]}
          cp "assets/banners/$v-light.svg" assets/banner-light.svg
          cp "assets/banners/$v-dark.svg"  assets/banner-dark.svg
          echo "VARIANT=$v" >> "$GITHUB_ENV"

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/banner-light.svg assets/banner-dark.svg
          if git diff --cached --quiet; then
            echo "Banner already $VARIANT -- nothing to commit"
          else
            git commit -m "Rotate banner: $VARIANT"
            git push
          fi
